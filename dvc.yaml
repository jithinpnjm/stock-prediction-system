stages:
  ingest:
    cmd: python pipelines/01_ingest.py
    deps:
      - pipelines/01_ingest.py
      - src/data/ingest.py
      - configs/data/banknifty.yaml
      - data/raw
    outs:
      - data/bronze/1m_canonical.parquet

  validate:
    cmd: python pipelines/02_validate.py
    deps:
      - pipelines/02_validate.py
      - src/data/validate.py
      - src/data/calendar.py
      - data/bronze/1m_canonical.parquet
      - configs/data/nse_holidays.csv
    outs:
      - artifacts/validation/1m_report.json

  aggregate:
    cmd: python pipelines/03_aggregate_5m.py
    deps:
      - pipelines/03_aggregate_5m.py
      - src/data/aggregate.py
      - data/bronze/1m_canonical.parquet
    outs:
      - data/silver/5m_canonical.parquet

  features:
    cmd: python pipelines/04_features.py
    deps:
      - pipelines/04_features.py
      - src/features
      - data/bronze/1m_canonical.parquet
      - data/silver/5m_canonical.parquet
      - configs/features/default.yaml
    outs:
      - data/gold/features_v1.parquet

  labels:
    cmd: python pipelines/05_labels.py
    deps:
      - pipelines/05_labels.py
      - src/labels
      - data/bronze/1m_canonical.parquet
      - data/gold/features_v1.parquet
      - configs/labels/baseline.yaml
    outs:
      - data/gold/dataset_v1.parquet

  dataset:
    cmd: python pipelines/06_build_dataset.py
    deps:
      - pipelines/06_build_dataset.py
      - data/gold/dataset_v1.parquet
    outs:
      - data/ml/training_frame.parquet
      - data/ml/X.parquet
      - data/ml/y.parquet
      - data/ml/feature_columns.json

  train:
    cmd: python pipelines/07_train.py
    deps:
      - pipelines/07_train.py
      - src/models
      - src/validation
      - src/mlops
      - data/ml/training_frame.parquet
      - configs/models/lgbm_baseline.yaml
      - configs/validation/default.yaml
      - configs/experiments/default.yaml
    outs:
      - data/ml/oof_predictions.parquet
      - artifacts/models/lgbm_dev.joblib

  validate_model:
    cmd: python pipelines/08_validate.py
    deps:
      - pipelines/08_validate.py
      - data/ml/oof_predictions.parquet
      - artifacts/models/lgbm_dev.joblib
    outs:
      - artifacts/validation/report.json

  backtest:
    cmd: python pipelines/09_backtest.py
    deps:
      - pipelines/09_backtest.py
      - src/backtest
      - data/ml/oof_predictions.parquet
      - data/silver/5m_canonical.parquet
      - configs/backtest/default.yaml
    outs:
      - data/backtest/equity_curve.parquet
      - data/backtest/trades.parquet
      - data/backtest/predictions_with_prices.parquet

  report:
    cmd: python pipelines/10_report.py
    deps:
      - pipelines/10_report.py
      - data/backtest/equity_curve.parquet
      - data/backtest/trades.parquet
    outs:
      - artifacts/backtest/report.json
