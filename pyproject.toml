[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banknifty-research"
version = "0.2.0"
description = "Research-grade Bank Nifty intraday price-action prediction platform"
authors = [{name = "Bank Nifty Research"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "dvc>=3.0.0",
    "mlflow>=2.10.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "numba>=0.59.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
]
[project.optional-dependencies]
ingest = ["fyers-apiv3>=3.1.0"]
research = ["hmmlearn>=0.3.0", "optuna>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "mypy>=1.10.0",
]
[project.scripts]
banknifty = "src.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*","pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4","E7","E9","F"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
