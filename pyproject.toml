[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "banknifty-research"
version = "0.2.0"
description = "Research-grade Bank Nifty intraday price-action prediction system"
authors = [{name = "Quantitative Research"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "dvc>=3.50",
    "mlflow>=2.10",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "numba>=0.59",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "fyers-apiv3>=3.0",
    "hmmlearn>=0.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
