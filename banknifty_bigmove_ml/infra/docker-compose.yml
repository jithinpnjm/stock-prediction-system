# MLflow tracking server + Postgres backend store, self-hosted on the Nebius
# VM. Artifact root lives on the mounted persistent volume (/data/mlops),
# not S3 — revisit only if artifact volume growth demands it.
#
# Usage (on the VM, after bootstrap_node.sh has mounted /data/mlops):
#   cp .env.example .env   # fill in a real MLFLOW_DB_PASSWORD
#   docker compose up -d
#
# Reach the UI from your laptop via an SSH tunnel, never publicly:
#   ssh -L 5000:localhost:5000 <user>@<vm-host>
#   open http://localhost:5000

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - /data/mlops/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - /data/mlops/mlflow-artifacts:/mlflow-artifacts
    ports:
      - "127.0.0.1:5000:5000"  # bound to localhost only — reach via SSH tunnel
