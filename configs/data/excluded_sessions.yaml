  - date: "2024-11-01"
    reason: "Diwali Muhurat trading -- abbreviated special session (no standard-session data present)"
  - date: "2025-10-21"
    reason: "Diwali Muhurat trading -- abbreviated special session (only 61 of 375 expected 1m bars present)"

